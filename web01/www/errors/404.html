<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>404 · BreachOut</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            font-family:
                Arial,
                sans-serif;

            color: #e9f2ed;

            background:
                linear-gradient(
                    rgba(53,242,154,.03) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(53,242,154,.03) 1px,
                    transparent 1px
                ),
                #07100b;

            background-size:
                40px 40px;
        }

        .card {
            width: 680px;
            max-width: 100%;

            padding: 45px;

            text-align: center;

            border: 1px solid #20392b;
            border-radius: 18px;

            background: #0d1712;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.35);
        }

        .logo {
            width: 270px;
            max-width: 80%;

            margin-bottom: 22px;
        }

        .code {
            margin-top: 4px;

            color: #35f29a;

            font-size: 82px;
            font-weight: 800;
        }

        h1 {
            margin:
                4px 0
                15px;

            font-size: 28px;
        }

        p {
            max-width: 500px;

            margin:
                0 auto
                30px;

            color: #839087;

            font-size: 17px;
            line-height: 1.6;
        }

        a {
            display: inline-block;

            padding: 13px 22px;

            border-radius: 9px;

            color: #04100a;
            background: #35f29a;

            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            background: #68ffb5;
        }
    </style>

    <link
        rel="icon"
        type="image/png"
        href="/assets/breachout-favicon.png?v=3"
    >

</head>

<body>

    <main class="card">

        <img
            class="logo"
            src="/assets/breachout-logo.png"
            alt="BreachOut"
        >

        <div class="code">
            404
        </div>

        <h1>
            Route naar nergens
        </h1>

        <p>
            Deze pagina bestaat niet, is verplaatst of hoort niet meer bij een actieve sessie.
        </p>

        <a href="/">
            Terug naar BreachOut
        </a>

    </main>

</body>
</html>
